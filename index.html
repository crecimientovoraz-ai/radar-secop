<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Licitaciones PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="bg-blue-700 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">📡 Radar SECOP II</h1>
            <span id="contador" class="bg-blue-900 px-3 py-1 rounded-full text-sm">Cargando...</span>
        </div>
    </nav>

<div class="container mx-auto mt-6 px-4">
    <div class="relative">
        <input type="text" id="buscador" placeholder="🔍 Buscar por entidad, ciudad, código o palabra clave..." 
               class="w-full p-4 pl-12 rounded-xl shadow-sm border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
        <div class="absolute left-4 top-4 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>
    </div>
</div>

    <div class="container mx-auto py-8 px-4">
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr class="bg-gray-100 border-b-2 border-gray-200 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            <th class="px-5 py-3">Fecha</th>
                            <th class="px-5 py-3">Código / Modalidad</th>
                            <th class="px-5 py-3">Entidad / Ubicación</th>
                            <th class="px-5 py-3">Objeto del Proceso</th>
                            <th class="px-5 py-3">Presupuesto</th>
                            <th class="px-5 py-3">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-licitaciones">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURACIÓN DE TU FIREBASE (Copia esto desde tu consola de Firebase)
        const firebaseConfig = {
            databaseURL: "https://radarlicitacionespro-default-rtdb.firebaseio.com/"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. LEER DATOS EN TIEMPO REAL
        const tabla = document.getElementById('tabla-licitaciones');
        const contador = document.getElementById('contador');

let todasLasLicitaciones = []; // Variable global para guardar los datos

db.ref('licitaciones').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        todasLasLicitaciones = Object.values(data).reverse();
        renderizarTabla(todasLasLicitaciones);
    }
});

// Función para dibujar la tabla
function renderizarTabla(lista) {
    const tabla = document.getElementById('tabla-licitaciones');
    const contador = document.getElementById('contador');
    tabla.innerHTML = "";
    contador.innerText = `${lista.length} Licitaciones encontradas`;

    lista.forEach(lic => {
        const row = `
            <tr class="hover:bg-gray-50 border-b border-gray-200">
                <td class="px-5 py-5 text-sm">${new Date(lic.fecha_deteccion).toLocaleDateString()}</td>
                <td class="px-5 py-5 text-sm">
                    <span class="font-bold text-blue-600">${lic.codigo || 'S/N'}</span><br>
                    <span class="text-xs text-gray-500 italic">${lic.modalidad || ''}</span>
                </td>
                <td class="px-5 py-5 text-sm">
                    <p class="font-semibold">${lic.entidad}</p>
                    <p class="text-xs text-gray-600">${lic.ciudad || 'Colombia'}</p>
                </td>
                <td class="px-5 py-5 text-sm"><p class="line-clamp-2">${lic.objeto}</p></td>
                <td class="px-5 py-5 text-sm font-bold text-green-700">
                    $${Number(lic.valor).toLocaleString('es-CO')}
                </td>
                <td class="px-5 py-5 text-sm text-center">
                    <a href="${lic.link}" target="_blank" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold hover:bg-blue-200 transition">Ver SECOP</a>
                </td>
            </tr>
        `;
        tabla.innerHTML += row;
    });
}

// LOGICA DEL BUSCADOR
document.getElementById('buscador').addEventListener('input', (e) => {
    const termino = e.target.value.toLowerCase();
    const filtradas = todasLasLicitaciones.filter(lic => {
        return lic.entidad.toLowerCase().includes(termino) || 
               lic.objeto.toLowerCase().includes(termino) || 
               (lic.ciudad && lic.ciudad.toLowerCase().includes(termino)) ||
               lic.codigo.toLowerCase().includes(termino);
    });
    renderizarTabla(filtradas);
});
            }
        });
    </script>
</body>
</html>
